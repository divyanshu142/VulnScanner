# ─────────────────────────────────────────────────────────────────────────────
# AndroidX — REQUIRED for Compose + modern libraries
# Without this, build fails with "useAndroidX property is not enabled" error
# ─────────────────────────────────────────────────────────────────────────────
android.useAndroidX=true

# ─────────────────────────────────────────────────────────────────────────────
# JVM Heap Memory — Fix for "OutOfMemoryError: Java heap space"
# D8 dexer (especially material-icons) needs more memory to compile
# Default is ~512m which is too low for large Compose projects
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ─────────────────────────────────────────────────────────────────────────────
# Gradle Performance Settings
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─────────────────────────────────────────────────────────────────────────────
# Kotlin
# ─────────────────────────────────────────────────────────────────────────────
kotlin.code.style=official
